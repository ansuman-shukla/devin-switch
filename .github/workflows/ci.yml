name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.runner }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python: "3.11"
          - runner: macos-15-intel
            python: "3.11"
          - runner: macos-15
            python: "3.13"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6.0.1
        with:
          version: "0.11.19"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: make lint test typecheck
      - name: Install pinned secret scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked python scripts/install_gitleaks.py "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: make secrets build
      - name: Audit packages and verify isolated uv installation
        run: uv run --locked python scripts/check_dist.py

  macos-package:
    name: Portable app (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6.0.1
        with:
          version: "0.11.19"
          python-version: "3.11"
          enable-cache: true
      - run: make dmg smoke-app
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: macos-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
