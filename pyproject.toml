[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devin-switch"
version = "0.3.0"
description = "A native macOS account manager and CLI for saved Devin profiles"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["macos", "cli", "account-manager", "devin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
ds = "devin_switch.cli:main"

[dependency-groups]
build = [
    "pyinstaller==6.16.0",
]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/devin_switch"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src", "tests", "scripts", "macos", ".github", ".gitignore",
    "pyproject.toml", "uv.lock", "Makefile", "README.md", "LICENSE", "NOTICE",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
