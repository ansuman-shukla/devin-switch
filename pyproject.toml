[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devin-switch"
version = "0.1.0"
description = "Local account profiles for the Devin CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ds = "devin_switch.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

